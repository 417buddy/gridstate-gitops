apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gridstate-region-a
  namespace: argocd

spec:
  project: default

  source:
    repoURL: "https://github.com/417buddy/gridstate-gitops.git"
    targetRevision: main
    path: k8s/region-a

  destination:
    server: "https://kubernetes.default.svc"
    namespace: gridstate

  syncPolicy:
    automated:
      selfHeal: true
      prune: true

    syncOptions:
      - CreateNamespace=false
