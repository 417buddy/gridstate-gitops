apiVersion: apps/v1
kind: Deployment
metadata:
  name: gridstate-worker
  namespace: gridstate
spec:
  replicas: 2
  selector:
    matchLabels: { app: gridstate-worker }
  template:
    metadata:
      labels: { app: gridstate-worker }
    spec:
      containers:
        - name: worker
          image: gridstate-worker:0.1.0
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef: { name: gridstate-config }
          securityContext:
            runAsNonRoot: true
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "300m", memory: "256Mi" }
          readinessProbe:
            httpGet: { path: /healthz, port: 3001 }
            initialDelaySeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: gridstate-worker
  namespace: gridstate
spec:
  selector: { app: gridstate-worker }
  ports:
    - port: 80
      targetPort: 3001
